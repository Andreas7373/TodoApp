# TaskService
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskservice
  template:
    metadata:
      labels:
        app: taskservice
    spec:
      containers:
        - name: taskservice
          image: andreas49152/todo-taskservice:v3
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-postgres
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=todoapp;Username=postgres;Password=$(POSTGRES_PASSWORD)"

---
apiVersion: v1
kind: Service
metadata:
  name: taskservice
spec:
  type: ClusterIP
  selector:
    app: taskservice
  ports:
    - port: 5029
      targetPort: 8080

---
# StatsService
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statsservice
  template:
    metadata:
      labels:
        app: statsservice
    spec:
      containers:
        - name: statsservice
          image: andreas49152/todo-statsservice:v1
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: TaskService__BaseUrl
              value: "http://taskservice:5029"

---
apiVersion: v1
kind: Service
metadata:
  name: statsservice
spec:
  type: ClusterIP
  selector:
    app: statsservice
  ports:
    - port: 5089
      targetPort: 8080

---
